[pytest]
pythonpath = src
testpaths = tests
addopts = -q
markers =
    unit: pruebas unitarias y de contrato sin servicios externos
    integration: pruebas contra una instancia desplegada
    selenium: pruebas de interfaz con navegador real
    security: pruebas de controles de seguridad
    performance: pruebas básicas de tiempo de respuesta
