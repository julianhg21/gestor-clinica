trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Usar Python 3.12'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements-dev.txt
  displayName: 'Instalar dependencias'

- script: |
    python -m compileall -q src tests
  displayName: 'Build / compilación'

- script: |
    pytest -q --junitxml=$(Common.TestResultsDirectory)/pytest.xml
  displayName: 'Ejecutar pruebas'

- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'pytest.xml'
    searchFolder: '$(Common.TestResultsDirectory)'
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true
  displayName: 'Publicar resultados de pruebas'

- script: |
    docker compose config
  displayName: 'Validar Docker Compose'

- script: |
    docker compose build
  displayName: 'Construir contenedores'

- script: |
    python -m pip install pip-audit
    python -m pip_audit -r requirements-dev.txt
  displayName: 'Auditar dependencias Python'
