name: Bootstrap Duality application

on:
  push:
    branches:
      - feature/aplicacion-duality
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/aplicacion-duality
          fetch-depth: 0

      - name: Materialize repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* > /tmp/duality.b64
          base64 --decode /tmp/duality.b64 > /tmp/duality.tar.gz
          test "$(sha256sum /tmp/duality.tar.gz | awk '{print $1}')" = "175de436d0f6f32d601e4ea4a9b61d491095628e220b7660dc022670e76c6822"
          tar -xzf /tmp/duality.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit generated application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: implement complete Duality clinic manager"
          git push origin HEAD:feature/aplicacion-duality
