services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duality}
      POSTGRES_USER: ${POSTGRES_USER:-duality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duality_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duality} -d ${POSTGRES_DB:-duality}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth:
    image: duality-auth:ci
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    environment: &app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-duality}:${POSTGRES_PASSWORD:-duality_dev_password}@postgres:5432/${POSTGRES_DB:-duality}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-123456789}
      JWT_EXP_MINUTES: ${JWT_EXP_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      default:
        aliases:
          - auth.railway.internal
    restart: unless-stopped

  pedidos:
    image: duality-pedidos:ci
    build:
      context: .
      dockerfile: docker/pedidos/Dockerfile
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8000"
    networks:
      default:
        aliases:
          - pedidos.railway.internal
    restart: unless-stopped

  web:
    image: duality-web:ci
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    depends_on:
      - auth
      - pedidos
    environment:
      AUTH_PORT: ${AUTH_PORT:-8000}
      PEDIDOS_PORT: ${PEDIDOS_PORT:-8000}
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
