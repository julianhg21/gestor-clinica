name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Static and contract tests
        run: |
          python -m compileall -q src
          pytest
          docker compose config >/dev/null

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and start complete stack
        run: docker compose up --build -d

      - name: Wait for services
        run: |
          for i in {1..45}; do
            if curl -fsS http://localhost:8001/api/auth/health >/dev/null               && curl -fsS http://localhost:8002/api/catalog/health >/dev/null               && curl -fsS http://localhost:8003/api/orders/health >/dev/null               && curl -fsS http://localhost:8004/api/payments/health >/dev/null               && curl -fsS http://localhost:8080 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify login and web smoke test
        run: |
          curl -fsS -X POST http://localhost:8001/api/auth/login             -H 'Content-Type: application/json'             -d '{"correo":"admin@duality.local","password":"Admin123!"}'             | python -c 'import json,sys; data=json.load(sys.stdin); assert data["access_token"]'
          SMOKE_BASE_URL=http://localhost:8080 pytest -q tests/test_smoke.py

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
