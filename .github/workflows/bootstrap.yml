name: bootstrap-duality-app

on:
  push:
    branches:
      - feature/duality-microservices
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack application
        run: bash .bootstrap/install.sh

      - name: Validate generated tree
        run: |
          python -m compileall -q src tests
          node --check src/web/app.js

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: implement Duality clinic management platform"
          git push origin HEAD:feature/duality-microservices
